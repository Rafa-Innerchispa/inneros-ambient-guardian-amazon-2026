[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-ambient-guardian"
version = "0.4.0"
description = "Local-first Alexa+ MCP guardian with bounded actions, human approval, verification, and evidence."
requires-python = ">=3.11"
dependencies = [
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anyio>=4.0",
  "starlette>=0.46",
  "mcp>=2.1,<2.2",
  "strands-agents[openai]>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ambient-guardian = "ambient_guardian.official_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ambient_guardian = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
