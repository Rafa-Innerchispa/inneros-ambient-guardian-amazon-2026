name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and integration tests
        run: PYTHONPATH=src pytest -q
      - name: Real server + Streamable HTTP MCP smoke
        run: PYTHONPATH=src python scripts/runtime_smoke.py
      - name: Docker build
        run: docker build -t inneros-ambient-guardian:test .
